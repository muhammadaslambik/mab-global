name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Ganti ke "npm ci" setelah ada package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run build:web
